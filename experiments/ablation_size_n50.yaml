# =============================================================================
# Plan: 입력 사이즈 ablation (2차, n=50, 활성)
# Status: 활성 — 현재 PS1 runner (`run_size_ablation_trainval.ps1`) 가 사용.
# Intent:
#   `ablation_size.yaml` (n=20)의 표본 부족 한계를 보완. 33 × 50 = 1650 →
#   0.8/0.1/0.1 split → train 1320 / val 165 / test 165. val/test 165는
#   33 class macro F1 분산이 안정적으로 측정될 표본.
# Hypothesis:
#   1024 BICUBIC > 512 > 384.
#   (기대: 1024가 chip 격자 + line/blob 모양 보존하는 최소 size — 이전 시각
#   비교에서 결정된 사양. memory: feedback_input_resolution_decision.md)
# Why these numbers:
#   - default 50: train 40 / val 5 / test 5 per class. Macro-F1 분모 33.
#     val/test 5는 클래스당 metric 잡음 ±0.2 수준이지만 33 class 평균하면 안정.
#   - epochs 30 + early stop patience 7: 작은 데이터라 10-15 epoch 안에 보통 수렴.
# Run:
#   python cnn_train.py --epochs 30 --subset-config experiments/ablation_size_n50.yaml \
#       --img-size 384  --batch 16 --model-tag sz384_n50
#   python cnn_train.py --epochs 30 --subset-config experiments/ablation_size_n50.yaml \
#       --img-size 512  --batch 8  --model-tag sz512_n50
#   python cnn_train.py --epochs 30 --subset-config experiments/ablation_size_n50.yaml \
#       --img-size 1024 --batch 2  --model-tag sz1024_n50
# 또는 PowerShell 순차:
#   .\experiments\run_size_ablation_trainval.ps1
# Output 비교 — 각 run 종료 후:
#   log/sz{N}_n50_<TS>_<test_f1>_<val_f1>/best_history.txt 의 [0] BEST OVERALL 줄
#   비교. 사이즈별 macro F1 / acc 차이를 PS1 runner 콘솔 stdout 으로도 볼 수 있음.
# =============================================================================
classes:
  default: 50
