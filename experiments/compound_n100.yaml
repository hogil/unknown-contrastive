# =============================================================================
# Plan: compound 학습 — wafer class별 100 sample (Stage 3 main run)
# Status: 활성 — n50 baseline 끝난 뒤 본 학습용
# Intent:
#   3-channel feature wafer CNN (cnn_train_failobj... → cnn_train_compound.py).
#   R = palette failbit, G = obj_id (chip CNN predict), B = zero.
#   wafer 33-class 분류. n=100 으로 수렴 안정성 확보 (n=50 baseline 의 분산 보완).
# Hypothesis:
#   compound (R+G) > failbit only (cnn_train.py R only) — 같은 subset 비교 시 macro F1 향상.
#   chip object 정보가 wafer pattern 식별에 추가 cue 제공.
# Why these numbers:
#   - default 100: wafer class당 100 → 33 × 100 = 3300 → train 2640 / val 330 / test 330
#   - val/test 330개면 macro F1 분산 ±0.025, 신뢰도 충분
# Run:
#   python cnn_train_compound.py \
#     --obj-id-dir D:/project/data/wm-811k/obj_id_maps \
#     --subset-config experiments/compound_n100.yaml \
#     --epochs 30 --batch 16 --img-size 384 --model-tag compound_n100
# Output 비교:
#   logs_all/compound_n100_<TS>_<test_f1>_<val_f1>/best_history.txt 의 [0] BEST OVERALL
#   vs logs_wafer/sz384_n50_<TS>_*/best_history.txt (failbit only) 차이
# =============================================================================
classes:
  default: 100
