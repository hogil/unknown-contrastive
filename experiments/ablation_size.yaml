# =============================================================================
# Plan: 입력 사이즈 ablation (1차 시도, n=20)
# Status: deprecated — `ablation_size_n50.yaml` (n=50) 으로 대체. 기록용 유지.
# Intent:
#   384 / 512 / 1024 BICUBIC 입력 사이즈가 fail-bit map 분류 성능에 미치는 영향
#   확인. chip 격자 (32×32) 보존이 클수록 모델이 chip-level 결함을 더 잘 인식할
#   거라는 가정.
# Hypothesis:
#   1024 BICUBIC ≥ 512 ≥ 384 (chip 격자 fidelity 비례)
# Why these numbers:
#   - default 20: 33 × 20 = 660. train 528 / val 66 / test 66. 빠르게 수렴 비교
#     가능하지만 val/test 표본이 너무 작아 metric 분산이 큼.
#   - 결론: n=20은 결과 분산이 커서 비교 신뢰도 낮음 → n=50으로 재시도.
# Run (legacy):
#   python cnn_train.py --epochs 30 --subset-config experiments/ablation_size.yaml \
#       --img-size {384|512|1024} --batch {16|8|2} --model-tag sz{N}_n20
# =============================================================================
classes:
  default: 20
