# =============================================================================
# Plan: quick smoke test
# Status: 활성 (smoke baseline)
# Intent:
#   학습 파이프라인이 깨지지 않았는지 빠르게 점검 — 코드 수정 후 sanity check.
#   33 class × 20 sample = 660 → 0.8/0.1/0.1 split → train 528 / val 66 / test 66.
#   2 epoch면 ~3-5분 안에 수렴 안 한 채로도 모든 산출물(per-class table, CM,
#   curves, best_history.txt, best_model.pth)이 정상 생성되는지 확인 가능.
# Hypothesis:
#   N/A (sanity test이라 가설 없음). 단지 train/val/test 모두 metric이 nan이
#   아니어야 하고 best_model.pth load 가능해야 함.
# Why these numbers:
#   - default 20: 클래스당 최소 split 만족 (val/test ≥ 1)하면서 빨리 끝나는 최소.
#   - epochs 2: 1 epoch는 best 갱신 안 일어날 수도 있어 2로.
#   - batch 8: 384 input + 작은 데이터에서 GPU mem 여유 확보 (low-spec 호환).
# Run:
#   python cnn_train.py --epochs 2 --subset-config experiments/quick.yaml \
#       --batch 8 --model-tag smoke
# =============================================================================
classes:
  default: 20
