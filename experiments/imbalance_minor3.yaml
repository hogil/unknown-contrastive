# =============================================================================
# Plan: class imbalance — class_weight 옵션 효과 비교
# Status: 미실행 (plan만 존재)
# Intent:
#   3개 minor class를 30 sample로 줄이고 나머지를 200 sample로 둬서 실제
#   imbalance 환경 시뮬레이션. `--class-weight {none, effective}` A/B 비교
#   해서 effective-number weight (Cui et al. β=0.999, default) 가 minor
#   class F1 회복에 효과 있는지 정량 측정.
# Hypothesis:
#   class_weight=effective → minor 3 class F1 ↑ (no_cw 대비)
#   trade-off: major class F1 약간 ↓ 가능 (전체 macro F1은 ↑ 기대)
# Why these numbers:
#   - 3 minor class = 30 sample (~7배 imbalance) — 실제 wafer fab 환경에서
#     특정 defect class가 희귀한 상황과 유사.
#   - 200 sample (default): 나머지 30 class 보호. 전체 train ≈ 5040 (200*30 - 60 + 90).
#   - Loc_invalid_main: 50 — 중간 imbalance 검증용 (중간 case 어떻게 처리되나).
# Run (A/B 비교):
#   python cnn_train.py --epochs 30 --subset-config experiments/imbalance_minor3.yaml \
#       --class-weight effective --model-tag imbal_eff_cw
#   python cnn_train.py --epochs 30 --subset-config experiments/imbalance_minor3.yaml \
#       --class-weight none      --model-tag imbal_no_cw
# 비교:
#   log/imbal_eff_cw_<TS>_<f1>_<f1>/best_history.txt 와
#   log/imbal_no_cw_<TS>_<f1>_<f1>/best_history.txt 의 [1] FINAL BEST per-class 표에서
#   Donut_scratch / Edge-Bottom_scratch / Loc_invalid_main 행만 발췌 비교.
# =============================================================================
classes:
  Donut_scratch: 30          # minor 1 — Donut wafer × scratch chip object
  Edge-Bottom_scratch: 30    # minor 2 — Edge-Bottom × scratch
  Loc_invalid_main: 50       # 중간 imbalance 검증
  default: 200               # 나머지 30 class
